server:
  host: "0.0.0.0"
  port: 8000
  debug: true
  log_level: "INFO"

security:
  secret_key: "aegisai-super-secret-jwt-key-change-in-production-32chars+"
  algorithm: "HS256"
  access_token_expire_minutes: 60

database:
  sqlite_url: "sqlite+aiosqlite:///./aegisai.db"

ml:
  xgboost_model_path: "app/ml/models/xgboost_intrusion.onnx"
  isolation_forest_path: "app/ml/models/isolation_forest.pkl"
  inference_batch_size: 32
  threat_score_threshold: 0.65
  anomaly_contamination: 0.05

monitoring:
  host_poll_interval: 2
  packet_capture_interface: "eth0"
  ram_pause_threshold: 85

containment:
  auto_kill_enabled: false
  auto_isolate_network: false
  critical_action_threshold: 0.90

logging:
  level: "INFO"
  format: "json"
  file: "logs/aegisai.log"
